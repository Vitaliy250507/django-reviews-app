<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReviewRestaurants</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light"> <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
            <a class="navbar-brand" href="{% url 'restaurants' %}">ReviewPlace</a>
            {% if user.is_authenticated %}
                <span class="navbar-text me-3">Привіт, {{ user.username }}!</span>
                <form action="{% url 'logout' %}" method="post" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-light btn-sm">Вийти</button>
                </form>
                <a class=" text-white me-3 d-inline" href="{% url 'profile' %}">Profile</a>
            {% else %}
                <a class=" text-white me-3 d-inline" href="{% url 'login' %}">Sign In</a>
                <a class=" btn btn-warning btn-sm text-dark px-3" href="{% url 'signup' %}">Sign Up</a>
            {% endif %}
        </div>
    </nav>
    <div class="container">
        <div class="container mt-3">
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show shadow-sm" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}
        </div>
        {% block content %}
        {% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
