{% extends 'base.html' %}

{% block content %}
<div class="container mt-5" style="max-width: 500px;">
    <div class="card shadow border-0 p-4">
        <h2 class="text-center mb-4">Реєстрація</h2>
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <div class="mb-3">
                    <label class="form-label"><strong>{{ field.label }}</strong></label>
                    {{ field }}
                    {% if field.help_text %}
                        <div class="form-text small text-muted">{{ field.help_text }}</div>
                    {% endif %}
                    {% if field.errors %}
                        <div class="text-danger small">{{ field.errors }}</div>
                    {% endif %}
                </div>
            {% endfor %}
            <button type="submit" class="btn btn-warning w-100 shadow-sm mt-3">Зареєструватися</button>
        </form>
        <div class="text-center mt-3 small">
            Вже маєте акаунт? <a href="{% url 'login' %}">Увійти</a>
        </div>
    </div>
</div>
{% endblock %}
